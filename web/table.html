<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Example</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>HTML Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Country</th>
        </tr>
        <tr>
            <td>Dom</td>
            <td>25</td>
            <td>USA</td>
        </tr>
        <tr>
            <td>Dorito</td>
            <td>30</td>
            <td>Canada</td>
        </tr>
        <tr>
            <td>Friedrice</td>
            <td>22</td>
            <td>Australia</td>
        </tr>
    </table>

</body>
</html>
